<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Traductor de YouTube</title>
  <style>
    body { width: 290px; margin: 0; padding: 16px; font: 14px Arial, sans-serif; }
    .topbar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
    .language-switch { width: auto; margin: 0; padding: 3px 7px; border: 1px solid #ccc; border-radius: 10px; background: #fff; font-size: 11px; }
    h3 { margin: 0 0 14px; }
    label { display: block; margin: 10px 0 4px; }
    select, button { box-sizing: border-box; width: 100%; padding: 8px; }
    button { margin-top: 16px; cursor: pointer; }
    #message { min-height: 18px; margin-top: 10px; color: #555; }
  </style>
</head>
<body>
  <div class="topbar">
    <button id="languageSwitch" class="language-switch" type="button" aria-label="Cambiar idioma">ES / EN</button>
  </div>
  <h3 id="title">Traductor de YouTube</h3>
  <label id="sourceLanguageLabel" for="sourceLanguage">Idioma del video</label>
  <select id="sourceLanguage">
    <option value="eng_Latn">Inglés</option>
    <option value="spa_Latn">Español</option>
    <option value="fra_Latn">Francés</option>
    <option value="deu_Latn">Alemán</option>
    <option value="ita_Latn">Italiano</option>
    <option value="por_Latn">Portugués</option>
    <option value="jpn_Jpan">Japonés</option>
    <option value="kor_Hang">Coreano</option>
  </select>

  <label id="targetLanguageLabel" for="targetLanguage">Traducir a</label>
  <select id="targetLanguage">
    <option value="spa_Latn">Español</option>
    <option value="eng_Latn">Inglés</option>
    <option value="fra_Latn">Francés</option>
    <option value="deu_Latn">Alemán</option>
    <option value="ita_Latn">Italiano</option>
    <option value="por_Latn">Portugués</option>
  </select>

  <label id="voiceLabel" for="voice">Voz</label>
  <select id="voice" disabled>
    <option>Cargando voces...</option>
  </select>

  <label id="modelLabel" for="model">Modelo Whisper local</label>
  <select id="model">
    <option value="tiny">Tiny: más rápido, menos preciso</option>
    <option value="base">Base: recomendado</option>
    <option value="small" selected>Small: más preciso, más lento</option>
    <option value="medium">Medium: alta precisión, lento</option>
    <option value="large-v3">Large-v3: máxima precisión, muy lento</option>
  </select>

  <button id="start">Procesar y traducir</button>
  <button id="stop" type="button">Detener</button>
  <div id="message" role="status"></div>
  <script src="popup.js"></script>
</body>
</html>
